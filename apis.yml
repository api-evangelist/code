aid: code
name: Code
description: >-
  Code is an open, self-custodial payments protocol and mobile wallet built on
  the Solana blockchain. Its SDK lets any web developer embed a "Pay with Code"
  button and accept permissionless micropayments — as little as 5 cents per
  transaction plus a flat 1-cent blockchain fee — with no sign-up required and
  just a few lines of code. The API is defined as gRPC/Protobuf services
  (code-protobuf-api): clients sign transaction intents with a self-custodial
  Ed25519 keypair, payments are created as idempotent payment intents, and
  completion is confirmed server-side or via JWT-signed webhooks. The entire
  stack — SDKs (JavaScript, Go, Python, PHP), the Code VM, and the on-chain
  Solana programs — is open source under the code-payments GitHub org. Code was
  seeded by Union Square Ventures.
